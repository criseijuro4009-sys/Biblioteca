<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160e09">

<title>La Biblioteca de Liz ❤️</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --wood-dark: #29170e;
    --wood: #55311e;
    --wood-light: #805034;

    --gold: #d8b06c;

    --paper: #ead9b8;
    --paper-light: #f5e9d0;

    --text: #3b2618;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    overflow-x: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #f4e5ca;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(125,78,44,.28),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #24150e,
            #100905
        );
}


/* =====================================================
   INTRO
===================================================== */

#intro {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(110,70,40,.35),
            transparent 45%
        ),
        #120a06;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#intro.hidden {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}

.intro-content {
    width: min(600px, 95vw);

    animation:
        introAppear 1.5s ease;
}

.intro-book {
    font-size: 75px;

    margin-bottom: 25px;

    filter:
        drop-shadow(
            0 15px 20px rgba(0,0,0,.5)
        );

    animation:
        floatingBook 3s ease-in-out infinite;
}

.intro-content h1 {
    font-size:
        clamp(2.5rem, 9vw, 5.5rem);

    font-weight: normal;

    color: #f0d39d;

    margin-bottom: 15px;
}

.intro-content p {
    color: #cdb493;

    line-height: 1.8;

    font-size: 1.1rem;

    margin-bottom: 35px;
}

.enter-button {
    border:
        1px solid var(--gold);

    background:
        rgba(216,176,108,.08);

    color: #f4dcae;

    padding:
        15px 32px;

    border-radius:
        50px;

    font-family: inherit;

    font-size: 1rem;

    cursor: pointer;

    transition: .3s;
}

.enter-button:hover {
    transform:
        translateY(-3px);

    background:
        var(--gold);

    color:
        #24150e;
}


/* =====================================================
   BIBLIOTECA
===================================================== */

.library {
    min-height: 100vh;

    padding:
        50px 20px 120px;
}

.library-header {
    text-align: center;

    margin-bottom: 55px;
}

.library-header h1 {
    font-size:
        clamp(2.3rem, 8vw, 5rem);

    font-weight: normal;

    color: #efd29b;

    text-shadow:
        0 4px 20px rgba(0,0,0,.6);
}

.library-header p {
    color: #c4a98c;

    margin-top: 12px;

    font-style: italic;
}


/* =====================================================
   HABITACIÓN
===================================================== */

.library-room {
    width:
        min(1200px, 96vw);

    margin:
        auto;

    padding:
        35px 25px 45px;

    position:
        relative;

    border-radius:
        8px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.4),
            transparent 20%,
            transparent 80%,
            rgba(0,0,0,.4)
        ),
        linear-gradient(
            180deg,
            #362014,
            #1e120c
        );

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.55),
        0 30px 80px rgba(0,0,0,.5);

    border:
        8px solid #3b2114;
}


/* =====================================================
   ESTANTES
===================================================== */

.shelf {
    position:
        relative;

    margin-bottom:
        55px;

    padding:
        20px 14px 0;

    display:
        grid;

    grid-template-columns:
        repeat(10, minmax(0,1fr));

    align-items:
        end;

    gap:
        7px;

    min-height:
        285px;

    border-bottom:
        20px solid var(--wood-light);

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.25),
            transparent 20%,
            transparent 80%,
            rgba(0,0,0,.25)
        );

    box-shadow:
        0 13px 0 var(--wood-dark),
        inset 0 -25px 30px rgba(0,0,0,.3);
}

.shelf::after {
    content: "";

    position:
        absolute;

    left:
        -12px;

    right:
        -12px;

    bottom:
        -30px;

    height:
        10px;

    background:
        linear-gradient(
            90deg,
            #2d190e,
            #71462b,
            #3a2114
        );

    box-shadow:
        0 5px 8px rgba(0,0,0,.5);
}


/* =====================================================
   LIBROS
===================================================== */

.book {
    --book-color:
        #6e3d3d;

    position:
        relative;

    height:
        225px;

    border-radius:
        3px 7px 7px 3px;

    cursor:
        pointer;

    transform-origin:
        bottom center;

    box-shadow:
        5px 8px 12px rgba(0,0,0,.55),
        inset -8px 0 rgba(0,0,0,.18),
        inset 3px 0 rgba(255,255,255,.1);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.1),
            transparent 15%,
            rgba(0,0,0,.15)
        ),
        var(--book-color);

    transition:
        transform .35s ease,
        filter .35s ease,
        opacity .35s ease;
}

.book:hover {
    transform:
        translateY(-16px)
        rotate(-2deg);

    filter:
        brightness(1.18);

    z-index:
        10;
}

.book::before {
    content: "";

    position:
        absolute;

    left:
        7px;

    top:
        0;

    bottom:
        0;

    width:
        3px;

    background:
        rgba(255,255,255,.2);
}

.book::after {
    content: "";

    position:
        absolute;

    left:
        15%;

    right:
        15%;

    top:
        15px;

    height:
        3px;

    background:
        rgba(255,255,255,.2);

    box-shadow:
        0 190px
        rgba(255,255,255,.12);
}

.book-spine {
    position:
        absolute;

    inset:
        0;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    writing-mode:
        vertical-rl;

    transform:
        rotate(180deg);

    padding:
        12px 4px;

    color:
        #f7e5c2;

    font-size:
        .88rem;

    letter-spacing:
        1px;

    text-shadow:
        0 2px 4px rgba(0,0,0,.5);

    overflow:
        hidden;
}

.book-number {
    position:
        absolute;

    top:
        8px;

    right:
        7px;

    color:
        rgba(255,255,255,.6);

    font-size:
        .65rem;
}


/* =====================================================
   COLORES DE LOS LIBROS
===================================================== */

.book:nth-child(1)  { --book-color:#7a3038; }
.book:nth-child(2)  { --book-color:#34566b; }
.book:nth-child(3)  { --book-color:#76502f; }
.book:nth-child(4)  { --book-color:#604474; }
.book:nth-child(5)  { --book-color:#356153; }
.book:nth-child(6)  { --book-color:#8b5030; }
.book:nth-child(7)  { --book-color:#754866; }
.book:nth-child(8)  { --book-color:#405d78; }
.book:nth-child(9)  { --book-color:#826b36; }
.book:nth-child(10) { --book-color:#663c39; }
.book:nth-child(11) { --book-color:#3e5d53; }
.book:nth-child(12) { --book-color:#72472e; }
.book:nth-child(13) { --book-color:#4b5279; }
.book:nth-child(14) { --book-color:#754967; }
.book:nth-child(15) { --book-color:#3d654d; }
.book:nth-child(16) { --book-color:#8a6039; }
.book:nth-child(17) { --book-color:#475b7c; }
.book:nth-child(18) { --book-color:#6e3e4b; }
.book:nth-child(19) { --book-color:#806037; }
.book:nth-child(20) { --book-color:#8b3042; }


/* =====================================================
   ANIMACIÓN DEL LIBRO
===================================================== */

/*
   Cuando se selecciona:

   1. Sale del estante.
   2. Se hace grande.
   3. Se acerca a la pantalla.
   4. Gira.
*/

.book.book-selected {
    z-index:
        5000;

    animation:
        bookLeavesShelf
        1.4s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes bookLeavesShelf {

    0% {

        transform:
            translate3d(
                0,
                0,
                0
            )
            rotate(0deg)
            scale(1);

        opacity:
            1;
    }

    30% {

        transform:
            translate3d(
                0,
                -70px,
                80px
            )
            rotate(-5deg)
            scale(1.08);

        opacity:
            1;
    }

    65% {

        transform:
            translate3d(
                0,
                -180px,
                250px
            )
            rotate(7deg)
            scale(1.35);

        opacity:
            1;
    }

    100% {

        transform:
            translate3d(
                0,
                -50vh,
                500px
            )
            rotateY(180deg)
            rotateZ(-3deg)
            scale(2);

        opacity:
            0;
    }
}


/*
   Los demás libros se oscurecen
   ligeramente durante la animación.
*/

.shelf.animating .book:not(.book-selected) {
    filter:
        brightness(.55);

    transition:
        filter .4s ease;
}


/* =====================================================
   REPRODUCTOR
===================================================== */

.music-player {
    position:
        fixed;

    right:
        18px;

    bottom:
        18px;

    z-index:
        8000;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        7px 9px;

    border:
        1px solid rgba(216,176,108,.35);

    border-radius:
        50px;

    background:
        rgba(22,13,8,.9);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.5);
}

.music-button {
    width:
        43px;

    height:
        43px;

    border:
        none;

    border-radius:
        50%;

    background:
        var(--gold);

    color:
        #26160e;

    cursor:
        pointer;

    font-size:
        17px;
}

.volume {
    width:
        75px;

    accent-color:
        var(--gold);
}

.song-name {
    max-width:
        150px;

    color:
        #d9c19d;

    font-size:
        .75rem;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =====================================================
   LECTOR
===================================================== */

.reader {
    position:
        fixed;

    inset:
        0;

    z-index:
        6000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        18px;

    background:
        rgba(7,4,2,.95);

    backdrop-filter:
        blur(15px);

    opacity:
        0;
}

.reader.active {

    display:
        flex;

    animation:
        readerAppear
        .5s
        ease
        forwards;
}

.book-display {

    width:
        min(980px,96vw);

    max-height:
        92vh;

    position:
        relative;

    perspective:
        1800px;
}

.reader-close {

    position:
        absolute;

    top:
        -12px;

    right:
        -12px;

    z-index:
        20;

    width:
        40px;

    height:
        40px;

    border:
        none;

    border-radius:
        50%;

    background:
        #ead4ad;

    color:
        #3c2517;

    cursor:
        pointer;

    font-size:
        18px;
}


/* =====================================================
   PORTADA
===================================================== */

.cover {

    min-height:
        650px;

    border-radius:
        5px 10px 10px 5px;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    text-align:
        center;

    padding:
        50px 30px;

    overflow:
        hidden;

    position:
        relative;

    color:
        white;

    background-size:
        cover;

    background-position:
        center;

    box-shadow:
        20px 25px 60px rgba(0,0,0,.7);

    animation:
        coverOpen
        .9s
        cubic-bezier(.2,.8,.2,1);
}

.cover::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:
        linear-gradient(
            rgba(0,0,0,.3),
            rgba(0,0,0,.7)
        );
}

.cover-content {

    position:
        relative;

    z-index:
        2;
}

.cover h2 {

    font-size:
        clamp(2.3rem,8vw,5rem);

    font-weight:
        normal;

    text-shadow:
        0 4px 15px #000;
}

.cover p {

    margin-top:
        18px;

    font-style:
        italic;

    font-size:
        1.1rem;

    text-shadow:
        0 2px 7px #000;
}

.open-book-button {

    margin-top:
        45px;

    padding:
        13px 28px;

    border:
        1px solid rgba(255,255,255,.7);

    border-radius:
        30px;

    background:
        rgba(255,255,255,.12);

    color:
        white;

    cursor:
        pointer;

    backdrop-filter:
        blur(5px);

    transition:
        .3s;
}

.open-book-button:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.2);
}


/* =====================================================
   PÁGINAS
===================================================== */

.page {

    min-height:
        650px;

    position:
        relative;

    padding:
        70px clamp(25px,8vw,100px);

    color:
        var(--text);

    background:
        repeating-linear-gradient(
            transparent 0,
            transparent 31px,
            rgba(90,60,35,.08) 32px
        ),
        var(--paper);

    border-radius:
        4px 10px 10px 4px;

    box-shadow:
        20px 25px 60px rgba(0,0,0,.65);

    overflow:
        hidden;

    animation:
        pageTurn
        .65s
        ease;
}

.page::before {

    content:
        "";

    position:
        absolute;

    left:
        45px;

    top:
        0;

    bottom:
        0;

    width:
        1px;

    background:
        rgba(170,70,70,.25);
}

.page h3 {

    font-size:
        clamp(1.8rem,5vw,3rem);

    font-weight:
        normal;

    margin-bottom:
        30px;

    color:
        #65432c;
}

.page-text {

    font-size:
        clamp(1rem,2vw,1.25rem);

    line-height:
        2;

    white-space:
        pre-line;
}

.page-number {

    position:
        absolute;

    bottom:
        25px;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        #80664b;

    font-style:
        italic;
}

.page-controls {

    position:
        absolute;

    left:
        50%;

    bottom:
        55px;

    transform:
        translateX(-50%);

    display:
        flex;

    gap:
        10px;
}

.page-controls button {

    border:
        1px solid #a58a6a;

    background:
        rgba(255,255,255,.65);

    color:
        #4a2e1c;

    padding:
        10px 18px;

    border-radius:
        25px;

    cursor:
        pointer;

    font-family:
        inherit;
}


/* =====================================================
   ANIMACIONES DEL LECTOR
===================================================== */

@keyframes readerAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes coverOpen {

    from {

        opacity: 0;

        transform:
            rotateY(-25deg)
            scale(.9);
    }

    to {

        opacity: 1;

        transform:
            rotateY(0)
            scale(1);
    }
}

@keyframes pageTurn {

    from {

        opacity: 0;

        transform:
            rotateY(-20deg)
            translateX(-25px);
    }

    to {

        opacity: 1;

        transform:
            rotateY(0)
            translateX(0);
    }
}

@keyframes introAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

@keyframes floatingBook {

    0%,100% {

        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {

        transform:
            translateY(-12px)
            rotate(2deg);
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:850px) {

    .shelf {

        grid-template-columns:
            repeat(5,1fr);

        min-height:
            220px;
    }

    .book {

        height:
            175px;
    }

    .book-spine {

        font-size:
            .65rem;
    }

    .library-room {

        padding:
            25px 10px 35px;
    }
}

@media(max-width:600px) {

    .library {

        padding:
            35px 10px 100px;
    }

    .library-room {

        width:
            100%;

        border-width:
            5px;

        padding:
            20px 7px 30px;
    }

    .shelf {

        gap:
            4px;

        padding:
            15px 6px 0;

        min-height:
            185px;

        border-bottom-width:
            14px;
    }

    .book {

        height:
            145px;
    }

    .book-spine {

        font-size:
            .55rem;
    }

    .book-number {

        font-size:
            .5rem;

        top:
            5px;

        right:
            4px;
    }

    .cover,
    .page {

        min-height:
            78vh;
    }

    .page {

        padding:
            55px 35px 120px;
    }

    .page::before {

        left:
            22px;
    }

    .page-text {

        line-height:
            1.8;
    }

    .music-player {

        right:
            10px;

        bottom:
            10px;
    }

    .song-name {

        display:
            none;
    }

    .volume {

        width:
            60px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">

    <div class="intro-content">

        <div class="intro-book">
            📖
        </div>

        <h1>
            Para Liz
        </h1>

        <p>
            Hay historias que merecen ser leídas...
            <br>
            y otras que merecen ser guardadas.
        </p>

        <button
            class="enter-button"

        >

        </button>

</section>


<!-- =====================================================
     BIBLIOTECA
===================================================== -->

<main class="library">

    <header class="library-header">

        <h1>
            La Biblioteca de Liz
        </h1>

        <p>
            Veinte libros. Una historia. Y muchas cosas que quiero decirte.
        </p>

    </header>


    <section class="library-room">

        <div
            class="shelf"
            id="shelf"
        ></div>

        <div
            class="shelf"
            id="shelf2"
        ></div>

    </section>

</main>


<!-- =====================================================
     MÚSICA

<div class="music-player">

    <span
        class="song-name"
        id="songName"

    <button
        class="music-button"
        id="musicButton"
        onclick="toggleMusic()"

</div>


<audio
    id="audio"
    preload="auto"
></audio>


<!-- =====================================================
     LECTOR
===================================================== -->

<section
    class="reader"
    id="reader"
>

    <div class="book-display">

        <button
            class="reader-close"
            onclick="closeBook()"
        >
            ✕
        </button>

        <div
            id="bookContent"
        ></div>

    </div>

</section>


<script>


/* =====================================================
   🎵 CANCIONES
===================================================== */

const canciones = {

    bienvenida:
        "PEGA_AQUI_URL_DE_BIENVENIDA",

    libro03:

    libro04:

    libro05:
        "https://cdn.imageurlgenerator.com/uploads/6cb86f83-ecd1-4e2d-956b-bd731d0f3c62.mp3",

    libro06:
        "https://cdn.imageurlgenerator.com/uploads/58d7de31-39c4-4975-9db1-1ec83e521bed.mp3",

   CREAR LIBROS
===================================================== */

function crearLibros() {

    const shelf =
        document.getElementById("shelf");

    const shelf2 =
        document.getElementById("shelf2");

    libros.forEach(
        (libro,index) => {

            const elemento =
                document.createElement("article");

            elemento.className =
                "book";

            elemento.innerHTML = `

                <span class="book-number">
                    ${String(index+1).padStart(2,"0")}
                </span>

                <span class="book-spine">
                    ${libro.titulo}
                </span>
            `;

            elemento.onclick =
                () =>
                seleccionarLibro(
                    elemento,
                    index
                );

            if(index < 10) {

                shelf.appendChild(
                    elemento
                );

            } else {

                shelf2.appendChild(
                    elemento
                );
            }

        }
    );
}


/* =====================================================
   ENTRADA
===================================================== */

function enterLibrary() {

    document
        .getElementById("intro")
        .classList.add("hidden");

    reproducirMusica(
        canciones.bienvenida,
        "Biblioteca"
    );
}


/* =====================================================
   ANIMACIÓN DEL LIBRO
===================================================== */

function seleccionarLibro(
    elemento,
    index
) {

    /*
       Evitamos que pueda abrir varios libros
       mientras uno está animándose.
    */

    if(
        document.querySelector(
            ".book.book-selected"
        )
    ) {

        return;
    }

    const estante =
        elemento.closest(".shelf");

    estante.classList.add(
        "animating"
    );

    elemento.classList.add(
        "book-selected"
    );


    /*
       Esperamos a que termine
       la animación del libro.
    */

    setTimeout(
        () => {

            estante.classList.remove(
                "animating"
            );

            elemento.classList.remove(
                "book-selected"
            );

            abrirLibro(index);

        },
        1250
    );
}


/* =====================================================
   MÚSICA
===================================================== */

function reproducirMusica(
    url,
    nombre
) {

    if(
        !url ||
        url.startsWith(
            "PEGA_AQUI"
        )
    ) {

        audio.pause();

        audio.removeAttribute(
            "src"
        );

        musicButton.textContent =
            "▶";

        songName.textContent =
            "Añade una canción";

        return;
    }

    audio.pause();

    audio.currentTime =
        0;

    audio.src =
        url;

    audio.volume =
        0.35;

    songName.textContent =
        nombre;

    audio.play()
        .then(
            () => {

                musicButton.textContent =
                    "⏸";

            }
        )
        .catch(
            () => {

                musicButton.textContent =
                    "▶";

            }
        );
}


function toggleMusic() {

    if(
        !audio.src
    ) {

        return;
    }

    if(
        audio.paused
    ) {

        audio.play();

        musicButton.textContent =
            "⏸";

    } else {

        audio.pause();

        musicButton.textContent =
            "▶";
    }
}


function changeVolume(
    valor
) {

    audio.volume =
        valor;
}


/* =====================================================
   ABRIR LIBRO
===================================================== */

function abrirLibro(
    index
) {

    libroActual =
        index;

    paginaActual =
        -1;

    const libro =
        libros[index];

    const numero =
        String(index + 1)
        .padStart(2,"0");

    reproducirMusica(
        canciones[
            "libro" + numero
        ],
        libro.titulo
    );

    document
        .getElementById("reader")
        .classList.add(
            "active"
        );

    mostrarPagina();
}


/* =====================================================
   MOSTRAR PÁGINA
===================================================== */

function mostrarPagina() {

    const libro =
        libros[
            libroActual
        ];

    const contenido =
        document.getElementById(
            "bookContent"
        );


    /* PORTADA */

    if(
        paginaActual === -1
    ) {

        const numero =
            String(
                libroActual + 1
            ).padStart(
                2,
                "0"
            );

        const imagen =
            portadas[
                "libro" + numero
            ];


        contenido.innerHTML = `

            <div
                class="cover"
                style="
                    background-image:
                    linear-gradient(
                        rgba(0,0,0,.3),
                        rgba(0,0,0,.7)
                    ),
                    url('${imagen}');
                "
            >

                <div
                    class="cover-content"
                >

                    <h2>
                        ${libro.titulo}
                    </h2>

                    <p>
                        ${libro.subtitulo}
                    </p>

                    <button
                        class="open-book-button"
                        onclick="siguientePagina()"
                    >
                        Abrir libro →
                    </button>

                </div>

            </div>
        `;

        return;
    }


    /* PÁGINA */

    const pagina =
        libro.paginas[
            paginaActual
        ];

    contenido.innerHTML = `

        <div
            class="page"
        >

            <h3>
                ${pagina.titulo}
            </h3>

            <div
                class="page-text"
            >
                ${pagina.texto}
            </div>

            <div
                class="page-number"
            >
                ${paginaActual + 1} / 3
            </div>

            <div
                class="page-controls"
            >

                <button
                    onclick="paginaAnterior()"
                    ${
                        paginaActual === 0
                        ? "disabled"
                        : ""
                    }
                >
                    ← Anterior
                </button>

                <button
                    onclick="siguientePagina()"
                >

                    ${
                        paginaActual === 2
                        ? "Cerrar libro"
                        : "Siguiente →"
                    }

                </button>

            </div>

        </div>
    `;
}


/* =====================================================
   SIGUIENTE
===================================================== */

function siguientePagina() {

    if(
        paginaActual < 2
    ) {

        paginaActual++;

        mostrarPagina();

    } else {

        cerrarLibro();
    }
}


/* =====================================================
   ANTERIOR
===================================================== */

function paginaAnterior() {

    if(
        paginaActual > 0
    ) {

        paginaActual--;

        mostrarPagina();

    } else {

        paginaActual = -1;

        mostrarPagina();
    }
}


/* =====================================================
   CERRAR
===================================================== */

function cerrarLibro() {

    document
        .getElementById("reader")
        .classList.remove(
            "active"
        );

    libroActual =
        null;

    paginaActual =
        -1;

    reproducirMusica(
        canciones.bienvenida,
        "Biblioteca"
    );
}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            libroActual !== null
        ) {

            cerrarLibro();
        }
    }
);


/* =====================================================
   INICIAR
===================================================== */

crearLibros();

</script>

</body>
</html>
